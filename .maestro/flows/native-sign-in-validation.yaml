# Sign-in checks the fields before calling the server, and the language switch works.
appId: ${APP_ID}
---
# clearKeychain: SecureStore is the iOS Keychain, which survives clearState
# (the stored language and session cookie would carry into the next run).
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
# The heading and the button are both "Sign in"; the button is the second.
- tapOn:
    text: "Sign in"
    index: 1
- assertVisible: "Fill this in."
- tapOn: "हिंदी"
- assertVisible: "साइन इन करें"
- takeScreenshot: sign-in-hindi
