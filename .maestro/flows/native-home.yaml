# Smoke test: a fresh install opens on sign-in (no stored session, no network call).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- assertVisible: "orrn"
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "हिंदी"
- takeScreenshot: sign-in
