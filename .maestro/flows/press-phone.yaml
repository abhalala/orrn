# Press role: the Press tab shows the lines, a line shows its queue read-only, and downtime can be started and stopped.
# NOT RUN ON A DEVICE: written against the screens, never executed (NATIVE-B). Needs a press-role user and the dev seed (line P1):
#   maestro test -e MAESTRO_EMAIL=press@orrn.local -e MAESTRO_PASSWORD=... .maestro/flows/press-phone.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn: "Press"
- assertVisible: "Start, stop and counting are done on the tablet at the press.*"
- tapOn: "P1.*"
- takeScreenshot: press-line
- assertNotVisible: "Start"
- tapOn: "Press stopped"
- tapOn: "Breakdown"
- tapOn:
    text: "Press stopped"
    index: 1
- assertVisible: "Press running again"
- takeScreenshot: press-downtime
- tapOn: "Press running again"
