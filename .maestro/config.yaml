# Maestro smoke flows for the orrn native app.
#
# Prerequisites:
#   - Install Maestro: https://maestro.mobile.dev/getting-started/installing-maestro
#   - Build and install the app (bundle id in.orrn.app) and start Metro: bun run dev:native
#   - Set MAESTRO_APP_ID only if you run it under another bundle id.
#
# Run: maestro test .maestro/flows

env:
  APP_ID: ${MAESTRO_APP_ID:-in.orrn.app}
