name: Deploy Production

# Auto-deploy on push to the `prod` branch. Manual dispatch is also
# allowed for hotfixes, but only the `prod` branch is honored — pushes
# to other branches and dispatches from non-prod refs are skipped below.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy orrn.in
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    env:
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      ALCHEMY_STAGE: production
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID_APP: ${{ secrets.CLOUDFLARE_ZONE_ID_APP }}
      CLOUDFLARE_ZONE_ID_IN: ${{ secrets.CLOUDFLARE_ZONE_ID_IN }}
      ORRN_MASTER_KEY: ${{ secrets.ORRN_MASTER_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      WEBHOOK_BASE_URL: ${{ vars.WEBHOOK_BASE_URL }}
      API_DOMAIN: api.orrn.in
      VITE_SERVER_URL: https://api.orrn.in
      VITE_PUBLIC_URL: https://orrn.in
      BETTER_AUTH_URL: https://api.orrn.in
      CORS_ORIGIN: https://orrn.in
      CORS_ALLOWED_ORIGINS: https://orrn.in
      WEB_PUBLIC_URL: https://orrn.in
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Deploy production
        run: bun run deploy:prod
