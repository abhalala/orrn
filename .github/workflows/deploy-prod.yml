name: Deploy Production

# Auto-deploy on push to the `prod` branch. Manual dispatch is also
# allowed for hotfixes, but only the `prod` branch is honored — pushes
# to other branches and dispatches from non-prod refs are skipped below.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy orrn.in
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    env:
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      ALCHEMY_STAGE: production
      # Column helper for imports. Optional: without it people map new layouts by hand.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional proxy route (the plant CLIProxyAPI behind Cloudflare Access). Set the Access pair together.
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      MODEL_ACCESS_CLIENT_ID: ${{ secrets.MODEL_ACCESS_CLIENT_ID }}
      MODEL_ACCESS_CLIENT_SECRET: ${{ secrets.MODEL_ACCESS_CLIENT_SECRET }}
      # Google sign-in. Optional: without both the sign-in screens hide Google. Set the pair together.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Native passkeys. Optional, not secrets (a repo variable or a secret works): without them the apps hide their passkey button.
      # The Apple Team ID and the Android release certificate SHA-256 (the Android passkey origin is derived from it; a given hash must agree).
      ORRN_APPLE_TEAM_ID: ${{ vars.ORRN_APPLE_TEAM_ID || secrets.ORRN_APPLE_TEAM_ID }}
      ORRN_ANDROID_CERT_SHA256: ${{ vars.ORRN_ANDROID_CERT_SHA256 || secrets.ORRN_ANDROID_CERT_SHA256 }}
      ANDROID_APK_KEY_HASH: ${{ vars.ANDROID_APK_KEY_HASH || secrets.ANDROID_APK_KEY_HASH }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID_APP: ${{ secrets.CLOUDFLARE_ZONE_ID_APP }}
      CLOUDFLARE_ZONE_ID_IN: ${{ secrets.CLOUDFLARE_ZONE_ID_IN }}
      ORRN_MASTER_KEY: ${{ secrets.ORRN_MASTER_KEY }}
      PURELYMAIL_SMTP_PASSWORD: ${{ secrets.PURELYMAIL_SMTP_PASSWORD }}
      WEBHOOK_BASE_URL: ${{ vars.WEBHOOK_BASE_URL }}
      API_DOMAIN: api.orrn.in
      VITE_SERVER_URL: https://api.orrn.in
      VITE_PUBLIC_URL: https://orrn.in
      BETTER_AUTH_URL: https://api.orrn.in
      CORS_ORIGIN: https://orrn.in
      CORS_ALLOWED_ORIGINS: https://orrn.in
      WEB_PUBLIC_URL: https://orrn.in
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Test production backup and migration guards
        run: bun test packages/server/scripts/production-safety.test.ts

      - name: Back up the deployed production database
        run: bun packages/server/scripts/production-safety.ts backup

      - name: Preserve the verified encrypted database backup
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-before-${{ github.run_id }}
          path: ${{ runner.temp }}/orrn-production-safety/backup.enc
          if-no-files-found: error
          retention-days: 30

      - name: Rehearse migrations on a production data copy
        run: bun packages/server/scripts/production-safety.ts rehearse

      - name: Deploy production
        run: bun run deploy:prod

      - name: Verify production database preservation
        run: bun packages/server/scripts/production-safety.ts verify

      - name: Remove temporary plaintext database files
        if: always()
        run: rm -rf "$RUNNER_TEMP/orrn-production-safety"
