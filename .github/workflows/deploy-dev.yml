name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev.orrn.app
    runs-on: ubuntu-latest
    environment: dev
    env:
      ALCHEMY_STAGE: dev
      # Column helper for imports. Optional: without it people map new layouts by hand.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional proxy route (the plant CLIProxyAPI behind Cloudflare Access). Set the Access pair together.
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      MODEL_ACCESS_CLIENT_ID: ${{ secrets.MODEL_ACCESS_CLIENT_ID }}
      MODEL_ACCESS_CLIENT_SECRET: ${{ secrets.MODEL_ACCESS_CLIENT_SECRET }}
      # Google sign-in. Optional: without both the sign-in screens hide Google. Set the pair together.
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # orrn buddy (Hermes). Optional: without all four HERMES_* the bubble is hidden and /buddy/chat answers 404.
      HERMES_BASE_URL: ${{ secrets.HERMES_BASE_URL }}
      HERMES_ACCESS_CLIENT_ID: ${{ secrets.HERMES_ACCESS_CLIENT_ID }}
      HERMES_ACCESS_CLIENT_SECRET: ${{ secrets.HERMES_ACCESS_CLIENT_SECRET }}
      HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
      # Company slugs that may connect the buddy (v1: fourcubesllp). Not a secret.
      BUDDY_COMPANIES: ${{ vars.BUDDY_COMPANIES }}
      # Native passkeys. Optional, not secrets (a repo variable or a secret works): without them the apps hide their passkey button.
      # The Apple Team ID and the Android release certificate SHA-256 (the Android passkey origin is derived from it; a given hash must agree).
      ORRN_APPLE_TEAM_ID: ${{ vars.ORRN_APPLE_TEAM_ID || secrets.ORRN_APPLE_TEAM_ID }}
      ORRN_ANDROID_CERT_SHA256: ${{ vars.ORRN_ANDROID_CERT_SHA256 || secrets.ORRN_ANDROID_CERT_SHA256 }}
      ANDROID_APK_KEY_HASH: ${{ vars.ANDROID_APK_KEY_HASH || secrets.ANDROID_APK_KEY_HASH }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ORRN_MASTER_KEY: ${{ secrets.ORRN_MASTER_KEY }}
      WEBHOOK_BASE_URL: ${{ vars.WEBHOOK_BASE_URL }}
      # Explicit dev-only escape hatch when R2 is not subscribed or its token has no R2 scope.
      ORRN_SKIP_R2: ${{ vars.ORRN_SKIP_R2 }}
      WEB_DOMAIN: dev.orrn.app
      API_DOMAIN: api.dev.orrn.app
      VITE_SERVER_URL: https://api.dev.orrn.app
      VITE_PUBLIC_URL: https://dev.orrn.app
      BETTER_AUTH_URL: https://api.dev.orrn.app
      CORS_ORIGIN: https://dev.orrn.app
      WEB_PUBLIC_URL: https://dev.orrn.app
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Deploy dev
        run: bun run deploy:dev
