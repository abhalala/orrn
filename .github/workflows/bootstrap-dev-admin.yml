name: Bootstrap Dev Admin

on:
  workflow_dispatch:
    inputs:
      email:
        description: Existing ORRN dev account to grant platform super-admin
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Grant dev platform super-admin
        working-directory: packages/server
        env:
          ADMIN_EMAIL: ${{ inputs.email }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The legacy script parses --stage= before --stage; email must never become an option.
          if [[ "$ADMIN_EMAIL" == --* ]]; then
            echo "::error::Email must not be a command-line option."
            exit 2
          fi
          bun src/infra/scripts/bootstrap-super-admin.ts --stage dev "$ADMIN_EMAIL"
